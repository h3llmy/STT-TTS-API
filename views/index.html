<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Rust STT Client</title>
</head>

<body>
  <h2>Rust Whisper STT</h2>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <pre id="output"></pre>

  <script>
    let socket;
    let audioContext;
    let processor;
    let input;
    let stream;

    const output = document.getElementById("output");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");

    let historyText = "";

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      stopBtn.disabled = false;
      historyText = "";
      output.textContent = "Connecting...";

      socket = new WebSocket("ws://localhost:3078/stt");
      socket.binaryType = "arraybuffer";

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const currentHistory = historyText.trim();
        const sep = currentHistory ? " " : "";

        if (data.type === "partial") {
          // Show history + what you are currently saying
          output.textContent = currentHistory + sep + data.text;
        } else if (data.type === "final") {
          // Commit the text to history when the server detects silence
          historyText = currentHistory + sep + data.text;
          output.textContent = historyText;
          console.log("Finalized sentence:", data.text);
        }
      };

      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new AudioContext({ sampleRate: 16000 });
        input = audioContext.createMediaStreamSource(stream);

        // Send audio chunks every 250ms (4096 samples)
        processor = audioContext.createScriptProcessor(4096, 1, 1);

        processor.onaudioprocess = (event) => {
          const floatData = event.inputBuffer.getChannelData(0);
          const pcmData = convertFloatToInt16(floatData);

          if (socket.readyState === WebSocket.OPEN) {
            socket.send(pcmData);
          }
        };

        input.connect(processor);
        processor.connect(audioContext.destination);
        output.textContent = "Listening...";
      } catch (err) {
        console.error(err);
        output.textContent = "Error: " + err.message;
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    };

    stopBtn.onclick = () => {
      startBtn.disabled = false;
      stopBtn.disabled = true;

      if (processor) processor.disconnect();
      if (input) input.disconnect();
      if (stream) stream.getTracks().forEach(track => track.stop());

      if (socket) socket.close();
    };

    function convertFloatToInt16(buffer) {
      const l = buffer.length;
      const buf = new ArrayBuffer(l * 2);
      const view = new DataView(buf);

      for (let i = 0; i < l; i++) {
        let s = Math.max(-1, Math.min(1, buffer[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return buf;
    }
  </script>
</body>

</html>
