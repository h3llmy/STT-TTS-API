<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Rust STT Client</title>
</head>

<body>
  <h2>Rust Whisper STT</h2>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <pre id="output"></pre>

  <hr />
  <h2>Rust Kokoro TTS</h2>
  <textarea id="tts-input" placeholder="Enter text to speak..." rows="3" cols="50"></textarea>
  <br />
  <button id="speak">Speak</button>
  <div id="tts-status"></div>

  <script>
    let socket;
    let audioContext;
    let processor;
    let input;
    let stream;

    const output = document.getElementById("output");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");

    let historyText = "";

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      stopBtn.disabled = false;
      historyText = "";
      output.textContent = "Connecting...";

      socket = new WebSocket("ws://localhost:3078/stt/transcribe");
      socket.binaryType = "arraybuffer";

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const currentHistory = historyText.trim();
        const sep = currentHistory ? " " : "";

        if (data.type === "partial") {
          // Show history + what you are currently saying
          output.textContent = currentHistory + sep + data.text;
        } else if (data.type === "final") {
          // Commit the text to history when the server detects silence
          historyText = currentHistory + sep + data.text;
          output.textContent = historyText;
          console.log("Finalized sentence:", data.text);
        }
      };

      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new AudioContext({ sampleRate: 16000 });
        input = audioContext.createMediaStreamSource(stream);

        // Send audio chunks every 250ms (4096 samples)
        processor = audioContext.createScriptProcessor(4096, 1, 1);

        processor.onaudioprocess = (event) => {
          const floatData = event.inputBuffer.getChannelData(0);
          const pcmData = convertFloatToInt16(floatData);

          if (socket.readyState === WebSocket.OPEN) {
            socket.send(pcmData);
          }
        };

        input.connect(processor);
        processor.connect(audioContext.destination);
        output.textContent = "Listening...";
      } catch (err) {
        console.error(err);
        output.textContent = "Error: " + err.message;
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    };

    stopBtn.onclick = () => {
      startBtn.disabled = false;
      stopBtn.disabled = true;

      if (processor) processor.disconnect();
      if (input) input.disconnect();
      if (stream) stream.getTracks().forEach(track => track.stop());

      if (socket) socket.close();
    };

    const speakBtn = document.getElementById("speak");
    const ttsInput = document.getElementById("tts-input");
    const ttsStatus = document.getElementById("tts-status");

    speakBtn.onclick = async () => {
      const text = ttsInput.value.trim();
      if (!text) return;

      speakBtn.disabled = true;
      ttsStatus.textContent = "Connecting to stream...";

      try {
        const response = await fetch(`/tts/generate?text=${encodeURIComponent(text)}`);
        if (!response.ok) throw new Error(await response.text());

        const sampleRate = parseInt(response.headers.get("x-sample-rate") || "24000");
        
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        const reader = response.body.getReader();
        let nextStartTime = audioContext.currentTime;
        let leftOver = new Uint8Array(0);

        ttsStatus.textContent = "Streaming & Playing...";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          // Handle potentially fragmented chunks (ensure we have full 2-byte samples)
          let combined = new Uint8Array(leftOver.length + value.length);
          combined.set(leftOver);
          combined.set(value, leftOver.length);

          const numSamples = Math.floor(combined.length / 2);
          const validByteLength = numSamples * 2;
          
          if (numSamples > 0) {
            const pcmData = new Int16Array(combined.buffer, 0, numSamples);
            const floatData = new Float32Array(numSamples);
            for (let i = 0; i < numSamples; i++) {
              floatData[i] = pcmData[i] / 32768.0;
            }

            const buffer = audioContext.createBuffer(1, floatData.length, sampleRate);
            buffer.copyToChannel(floatData, 0);

            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);

            // Schedule this chunk to play right after the previous one
            const now = audioContext.currentTime;
            if (nextStartTime < now) {
              nextStartTime = now + 0.05; // Small buffer for the first chunk
            }
            
            source.start(nextStartTime);
            nextStartTime += buffer.duration;
          }

          leftOver = combined.slice(validByteLength);
        }

        // Wait for the last chunk to finish playing based on timing
        const waitTime = (nextStartTime - audioContext.currentTime) * 1000;
        setTimeout(() => {
          ttsStatus.textContent = "Finished.";
          speakBtn.disabled = false;
        }, Math.max(0, waitTime));

      } catch (err) {
        console.error("TTS Streaming Error:", err);
        ttsStatus.textContent = "Error: " + err.message;
        speakBtn.disabled = false;
      }
    };

    function convertFloatToInt16(buffer) {
      const l = buffer.length;
      const buf = new ArrayBuffer(l * 2);
      const view = new DataView(buf);

      for (let i = 0; i < l; i++) {
        let s = Math.max(-1, Math.min(1, buffer[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return buf;
    }
  </script>
</body>

</html>
